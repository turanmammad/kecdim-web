<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keçdim — Ödənişin nəticəsi</title>
<meta name="description" content="Keçdim+ ödənişinin nəticəsi.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://kecdim.pro-tech.az/odenis-netice.html">
<style>
  :root { --g:#16A34A; --r:#DC2626; --y:#CA8A04; --ink:#1C2321; --muted:#6B7671; --bg:#FAFAF7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         line-height:1.65; }
  .wrap { max-width:560px; margin:0 auto; padding:32px 22px 80px; }
  header { display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:40px; border-radius:11px; background:var(--g); display:flex;
          align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px; }
  .card { background:#fff; border:1px solid rgba(28,35,33,.08); border-radius:16px;
          padding:28px 24px; margin-top:24px; text-align:center; }
  .mark { width:64px; height:64px; border-radius:50%; margin:0 auto 16px; display:flex;
          align-items:center; justify-content:center; font-size:32px; color:#fff; }
  h1 { font-size:23px; margin:0 0 8px; }
  p { color:#3C453F; margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px;
         padding:0 22px; border-radius:12px; background:var(--g); color:#fff;
         text-decoration:none; font-weight:600; margin-top:18px; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid rgba(28,35,33,.15); }
  .ref { margin-top:18px; font-size:13px; color:var(--muted); word-break:break-all; }
  a { color:var(--g); }
  footer { margin-top:34px; text-align:center; font-size:13px; color:var(--muted); }
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FXBNW1V7D0"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-FXBNW1V7D0",{"anonymize_ip":true,"allow_google_signals":false});</script>
</head>
<body>
<div class="wrap">
  <header><div class="logo">K</div><strong>Keçdim</strong></header>

  <div class="card" id="card">
    <div class="mark" id="mark" style="background:#E5E8E6">…</div>
    <h1 id="title">Yoxlanılır…</h1>
    <p id="text">Ödənişin vəziyyəti oxunur.</p>
    <div id="actions"></div>
    <div class="ref" id="ref"></div>
  </div>

  <footer>
    Sualın var? <a href="/support.html">Dəstək</a> · <a href="/odenis.html">Abunə şərtləri</a>
  </footer>
</div>

<script>
// Vəziyyət bizim `kapital-pay/return` funksiyasından gəlir — o, qərarı bankdan
// `GET /order/{id}` ilə YENİDƏN oxuyub verir. Bankın geri-yönləndirmədəki öz
// `STATUS` parametri burada İŞLƏDİLMİR (bank sənədi onu «müvəqqəti ola bilər»
// adlandırır), ona görə bu səhifə də ona baxmır.
(function () {
  var q = new URLSearchParams(location.search);
  var s = (q.get("s") || "").toLowerCase();
  var o = q.get("o") || "";

  var views = {
    paid: {
      bg: "#16A34A", icon: "✓", title: "Ödəniş uğurlu oldu",
      text: "Keçdim+ hesabına aktivləşdirildi. Tətbiqi aç — paketin dərhal işləkdir.",
      actions: '<a class="btn" href="/#yukle">Tətbiqi aç</a>'
    },
    failed: {
      bg: "#DC2626", icon: "✕", title: "Ödəniş baş tutmadı",
      text: "Bank əməliyyatı təsdiqləmədi. Kartından pul SİLİNMƏYİB. " +
            "Kart məlumatlarını (xüsusən CVV2 və bitmə tarixini) yoxlayıb yenidən sına.",
      actions: '<a class="btn" href="/#qiymet">Yenidən sına</a>' +
               ' <a class="btn ghost" href="/support.html">Dəstək</a>'
    },
    pending: {
      bg: "#CA8A04", icon: "…", title: "Ödəniş yoxlanılır",
      text: "Bank hələ yekun cavab verməyib. Bu, adətən bir neçə dəqiqə çəkir — " +
            "sistem vəziyyəti özü yenidən yoxlayır və ödəniş təsdiqlənən kimi " +
            "Keçdim+ hesabına yazılır. Bu səhifəni bağlaya bilərsən.",
      actions: '<a class="btn ghost" href="/support.html">Dəstək</a>'
    }
  };

  var v = views[s] || views.pending;
  document.getElementById("mark").style.background = v.bg;
  document.getElementById("mark").textContent = v.icon;
  document.getElementById("title").textContent = v.title;
  document.getElementById("text").textContent = v.text;
  document.getElementById("actions").innerHTML = v.actions;
  if (o) {
    document.getElementById("ref").textContent = "Sifariş nömrəsi: " + o;
  }
  document.title = "Keçdim — " + v.title;
})();
</script>
</body>
</html>
